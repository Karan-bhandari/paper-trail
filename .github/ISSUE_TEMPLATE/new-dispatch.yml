name: New Dispatch
description: Add a new curated link to Paper Trail from your phone or browser
title: "Dispatch: "
labels: ["dispatch"]
body:
  - type: markdown
    attributes:
      value: |
        Submit a link to automatically generate a dispatch and open a Pull Request.
  - type: input
    id: url
    attributes:
      label: URL
      description: The full URL to the article or resource.
      placeholder: "https://example.com/article"
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags (e.g. systems, ai, databases, web).
      placeholder: "systems, databases"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / Takeaway
      description: Your personal takeaway or commentary. If left blank, page meta description is used.
      placeholder: "Interesting perspective on..."
    validations:
      required: false
