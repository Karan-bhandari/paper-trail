name: Deploy Paper Trail to Cloudflare

on:
  push:
    branches:
      - main
  # Refresh The Radar news feeds every 2 hours
  schedule:
    - cron: '0 */2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'cloudflare-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit test suite
        run: npm test

      - name: Verify TypeScript & Astro types
        run: npm run check

      - name: Fetch rocket launches from LL2 (Every 6 hours)
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( 10#$HOUR % 6 )) -eq 0 ]; then
            echo "[github-actions] Triggering 6-hour Launch Radar update (UTC Hour: $HOUR)..."
            npm run update:launches
          else
            echo "[github-actions] Skipping Launch Radar update (UTC Hour: $HOUR). Using cached snapshot."
          fi

      - name: Build static site & feeds
        env:
          SITE_URL: https://kbkaran.com
          BASE_PATH: /paper-trail
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
