name: Add Feed from Issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-feed-pr:
    # Security: Strictly restrict execution to the repository owner
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'feed') || startsWith(github.event.issue.title, 'Feed:'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Feed & Update Feeds List
        id: feed
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node scripts/add-feed.mjs --from-issue

      - name: Verify Data Schema
        run: |
          npm test

      - name: Commit and Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Karan Bhandari"
          git config user.email "30714687+Karan-bhandari@users.noreply.github.com"

          BRANCH="feed/${{ steps.feed.outputs.slug }}"
          git checkout -b "$BRANCH"
          git add src/data/feeds.json
          git commit -m "content: add feed '${{ steps.feed.outputs.name }}'"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Feed: ${{ steps.feed.outputs.name }}" \
            --body-file /tmp/pr-body.txt \
            --head "$BRANCH" \
            --base main)

          gh issue comment ${{ github.event.issue.number }} --body "Created Pull Request: $PR_URL - Review and tap **Merge pull request** to add this feed to Paper Trail."
